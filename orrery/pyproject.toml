[project]
name = "orrery"
version = "0.1.0"
description = "A deterministic simulation & environment-generation engine for evaluating, training, and stress-testing autonomous AI agents."
readme = "README.md"
authors = [
    { name = "Nikhil Vytla", email = "cnikhil.vytla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
orrery = "orrery.cli:main"

# Plugin discovery groups (ADR-0006 / plugins.py). Third-party packages extend
# Orrery by exposing entry points in these groups.
[project.entry-points."orrery.policies"]
builtin = "orrery.actors:register_builtin_policies"

[project.entry-points."orrery.verifiers"]
builtin = "orrery.verify:register_builtin_verifiers"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.156.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
