name: Jev scene lifetimes

on:
  pull_request:
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-scene-lifetimes.yml"
  push:
    branches: [main]
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-scene-lifetimes.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install application
        working-directory: jev-experiments/experience-prototypes
        run: bun install --frozen-lockfile
      - name: Build application from committed research inputs
        working-directory: jev-experiments/experience-prototypes
        run: bun run build
      - name: Verify request, timer and media lifetimes
        run: bun test jev-experiments/scene-lifetimes-2026-09-22 jev-experiments/rewardbench2/publication-source.test.ts jev-experiments/rewardbench2/publication.test.ts
      - name: Verify public record integrity
        run: bun run jev-experiments/roadmap/verification/publication.ts
