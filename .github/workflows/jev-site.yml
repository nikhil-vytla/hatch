name: Jev site

# One install and one build for every check that needs the built site. These used to be three
# workflows (Jev scene lifetimes, Jev playground, Jev portable evidence), each installing and
# building the site again before its own tests.

on:
  pull_request:
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-site.yml"
  push:
    branches: [main]
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-site.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install from the canonical lockfile
        working-directory: jev-experiments/experience-prototypes
        run: bun install --frozen-lockfile
      - name: Build the committed candidate from committed inputs and bind source-view revisions
        working-directory: jev-experiments/experience-prototypes
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bun run build

      # Formerly Jev scene lifetimes
      - name: Verify request, timer and media lifetimes
        run: bun test jev-experiments/scene-lifetimes-2026-09-22 jev-experiments/rewardbench2/publication-source.test.ts jev-experiments/rewardbench2/publication.test.ts
      - name: Arena models and recordings
        run: bun test jev-experiments/packages/arena
      - name: Live worlds
        run: bun test jev-experiments/live-worlds
      - name: jev-lab CLI
        run: bun test jev-experiments/tools/decide-cli
      - name: Catalog links and app units
        run: bun test jev-experiments/experience-prototypes/src

      # Formerly Jev playground
      - name: Verify source controls, note figures and metadata
        run: bun test jev-experiments/release-implementation-2026-09-22/source-code/source.test.ts jev-experiments/release-implementation-2026-09-22/source-revision/revision.test.ts jev-experiments/release-implementation-2026-09-22/notes jev-experiments/music-arranger-v2/engine.test.ts jev-experiments/capability-atlas-2026-09-22/prepare-atlas.test.ts

      # Formerly Jev portable evidence
      - name: Verify portable records, indexes and publication projections
        run: bun test jev-experiments/roadmap/integration/portable-records.test.ts jev-experiments/roadmap/integration/portable-clients.test.ts jev-experiments/roadmap/integration/portable-publication.test.ts jev-experiments/capability-atlas-2026-09-22/publication-projection.test.ts
      - name: Rebuild the archive evidence index
        run: python3 jev-experiments/roadmap/integration/evidence_index.py

      - name: Verify public record integrity
        run: bun run jev-experiments/roadmap/verification/publication.ts
      - name: Keep committed evidence, indexes and source unchanged
        run: git diff --exit-code
