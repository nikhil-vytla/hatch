name: Jev native gateway

on:
  pull_request:
    paths:
      - "jev-experiments/experience-prototypes/server/**"
      - "jev-experiments/packages/decision-runtime/**"
      - "jev-experiments/roadmap/runtime/accounting.ts"
      - "jev-experiments/gateway-accounting-2026-09-22/**"
      - ".github/workflows/jev-gateway.yml"
  push:
    branches: [main]
    paths:
      - "jev-experiments/experience-prototypes/server/**"
      - "jev-experiments/packages/decision-runtime/**"
      - "jev-experiments/roadmap/runtime/accounting.ts"
      - "jev-experiments/gateway-accounting-2026-09-22/**"
      - ".github/workflows/jev-gateway.yml"

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install application
        working-directory: jev-experiments/experience-prototypes
        run: bun install --frozen-lockfile
      - name: Build application
        working-directory: jev-experiments/experience-prototypes
        run: bun run build
      - name: Verify native transport and accounting without provider calls
        run: bun test jev-experiments/gateway-accounting-2026-09-22 jev-experiments/experience-prototypes/server/byok.test.ts jev-experiments/roadmap/runtime/existing-contract.test.ts
