name: Jev playground

on:
  pull_request:
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-playground.yml"
  push:
    branches: [main]
    paths:
      - "jev-experiments/**"
      - ".github/workflows/jev-playground.yml"

permissions:
  contents: read

jobs:
  homepage-notes-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install from the canonical lockfile
        working-directory: jev-experiments/experience-prototypes
        run: bun install --frozen-lockfile
      - name: Build the committed candidate and bind source-view revisions
        working-directory: jev-experiments/experience-prototypes
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: bun run build
      - name: Verify source controls, note figures, material rules and metadata
        run: bun test jev-experiments/release-implementation-2026-09-22/source-code/source.test.ts jev-experiments/release-implementation-2026-09-22/source-revision/revision.test.ts jev-experiments/release-implementation-2026-09-22/notes jev-experiments/roadmap/materials jev-experiments/music-arranger-v2/engine.test.ts jev-experiments/capability-atlas-2026-09-22/prepare-atlas.test.ts
      - name: Verify public record integrity
        run: bun run jev-experiments/roadmap/verification/publication.ts
      - name: Keep committed evidence and source unchanged
        run: git diff --exit-code
