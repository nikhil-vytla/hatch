name: Jev native questions
on:
  pull_request:
    paths: ['jev-experiments/packages/decision-runtime/**', 'jev-experiments/adapters/**', 'jev-experiments/src/jev_lab/**', 'jev-experiments/tests/**', '.github/workflows/jev-native-questions.yml']
  push:
    branches: [main]
    paths: ['jev-experiments/packages/decision-runtime/**', 'jev-experiments/adapters/**', 'jev-experiments/src/jev_lab/**', 'jev-experiments/tests/**', '.github/workflows/jev-native-questions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        working-directory: jev-experiments/adapters/typescript
      - run: bunx --no-install tsc --noEmit
        working-directory: jev-experiments/adapters/typescript
      - run: bun test index.test.ts ../../packages/decision-runtime/src/native.test.ts
        working-directory: jev-experiments/adapters/typescript
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
        working-directory: jev-experiments
      - run: uv run --frozen pytest -q tests
        working-directory: jev-experiments
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: jev-experiments/adapters/go/go.mod }
      - run: go test ./...
        working-directory: jev-experiments/adapters/go
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
        working-directory: jev-experiments/adapters/rust
