[project]
name = "strive"
version = "0.1.0"
description = "A self-evolving agent harness: execute, observe, evaluate, diagnose, propose, validate, accept/reject, retain, repeat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strive = "strive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
