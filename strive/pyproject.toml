[project]
name = "strive"
version = "0.2.0"
description = "Durable mechanisms for model-led adaptation: a content-addressed store, hash-chained journal, pure verifier and adaptation policy over allowlisted surfaces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strive = "strive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    # adapters/tau2/src imports these at type-check time (its own runtime uses
    # a separate --extra telecom venv per scripts/install-tau2.sh); without
    # them here, `uv sync --frozen` silently leaves mypy unable to check tau2.
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "adapters/tau2/src", "adapters/counter/src"]
mypy_path = ["adapters/tau2/src", "adapters/counter/src"]

[[tool.mypy.overrides]]
module = ["tau2.*"]
ignore_missing_imports = true
