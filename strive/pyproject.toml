[project]
name = "strive"
version = "0.2.0"
description = "Durable mechanisms for model-led adaptation: a run-scoped, semantically-verified event/CAS substrate and a result-driven resumable policy kernel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.3.0",
]

[project.scripts]
strive = "strive.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

# DSPy ships no py.typed marker; the deno-pyodide backend uses it behind a
# narrow typed wrapper (strive.sandbox_backends).
[[tool.mypy.overrides]]
module = ["dspy.*"]
ignore_missing_imports = true
