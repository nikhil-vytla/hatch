[project]
name = "tally"
version = "0.9.0"
description = "Invoices, VAT and currency conversion for small businesses."
requires-python = ">=3.11"
dependencies = [
    "babel-lite==2.4.1",
    "holidays-mini==0.31.0",
    "iso4217-data==2.0.0",
    "pdfkit-tiny==0.7.2",
]

[tool.tally.lock]
# Packages resolve from the in-house index mirror, vendor/index.json.
index = "vendor/index.json"
