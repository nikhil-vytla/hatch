[workspace]
resolver = "3"
members = ["crates/proto", "crates/strived"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
strive-proto = { path = "crates/proto" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
ts-rs = "12.0.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = "thin"
