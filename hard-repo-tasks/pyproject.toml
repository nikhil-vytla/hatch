[project]
name = "parallax-repo-tasks"
version = "0.1.0"
description = "Compile repositories into fresh, executable agent tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parallax = "parallax.cli:main"

[project.optional-dependencies]
verifiers = [
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git" }
