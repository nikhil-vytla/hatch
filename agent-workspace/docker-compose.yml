services:
  agent-workspace:
    build: .
    ports:
      - "127.0.0.1:8899:8899"
    environment:
      HOST: 0.0.0.0
      PORT: 8899
      # Required when binding 0.0.0.0 — the server fails closed without it.
      WORKSPACE_PASSWORD: ${WORKSPACE_PASSWORD:?set WORKSPACE_PASSWORD in .env}
      # Default backend is OpenCode free models (no key). To use any
      # OpenAI-compatible server instead:
      # OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      # WORKSPACE_MODEL: qwen3:32b
      # OPENAI_API_KEY: ...
    volumes:
      - workspace-data:/data

volumes:
  workspace-data:
