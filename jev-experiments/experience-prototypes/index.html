<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#141614" />
    <link rel="icon" href="/favicon.svg" />
    <title>Jev / A living laboratory</title>
    <meta
      name="description"
      content="Small decisions, extraordinary possibilities. An interactive laboratory for Jev."
    />
    <script>
      try {
        let t = localStorage.getItem("jev-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light"
            : t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
